version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: ci }
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]
    commit-message: { prefix: build }
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build }
