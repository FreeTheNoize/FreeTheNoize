# Audio-only ffmpeg for the desktop builds and the Docker image
# (packaging/ffmpeg/build.sh). A stock ffmpeg is ~50 MB of video codecs we
# never use; this one is ~4 MB.
#
#   pull request touching packaging/ffmpeg → build every platform + check.py
#   Run workflow (from develop)            → same, then publish the binaries as
#                                            the release named in assets.txt;
#                                            paste the printed SHA256SUMS there.
name: ffmpeg
on:
  pull_request:
    paths: ["packaging/ffmpeg/**", ".github/workflows/ffmpeg.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, asset: ffmpeg-macos-arm64 }
          - { os: macos-15-intel, asset: ffmpeg-macos-x86_64 }
          - { os: ubuntu-22.04, asset: ffmpeg-linux-x86_64 }
          - { os: ubuntu-22.04-arm, asset: ffmpeg-linux-arm64 }
          - { os: ubuntu-22.04, asset: ffmpeg-windows-x86_64.exe, target: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            if [ "$(uname -m)" = x86_64 ]; then brew install nasm; fi
          else
            sudo apt-get update -q
            sudo apt-get install -yq --no-install-recommends nasm libssl-dev pkg-config
            if [ "${{ matrix.target }}" = windows ]; then
              sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64
            fi
          fi
      - name: Build
        shell: bash
        run: |
          packaging/ffmpeg/build.sh out ${{ matrix.target || 'native' }}
          mv out/ffmpeg* "${{ matrix.asset }}"
      - name: Check (native builds)
        if: matrix.target != 'windows'
        run: python3 packaging/ffmpeg/check.py "./${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # The Windows binary is cross-compiled; run it where it will run.
  check-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows-x86_64.exe
      - run: python packaging/ffmpeg/check.py .\ffmpeg-windows-x86_64.exe

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs: [build, check-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ffmpeg-*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(awk '$1 == "tag" {print $2}' packaging/ffmpeg/assets.txt)
          (cd dist && sha256sum -- ffmpeg-* > SHA256SUMS)
          # Not the project's "latest" release, and never re-published over an existing tag.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$TAG (audio-only ffmpeg for the builds)" \
            --notes "Built by .github/workflows/ffmpeg.yml from packaging/ffmpeg/build.sh. Not an app release."
          echo "Paste into packaging/ffmpeg/assets.txt:"
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
