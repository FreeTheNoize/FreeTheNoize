# Docker image (linux/amd64 + linux/arm64) on GHCR.
#   PR            → build only (amd64), checks that the container starts
#   push develop  → ghcr.io/freethenoize/freethenoize:edge
#   release       → :X.Y.Z, :X.Y, :X and :latest (called from release.yml)
name: Docker
on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "freethenoize/**", ".github/workflows/docker.yml"]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/freethenoize/freethenoize

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' && inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=FreeTheNoize
            org.opencontainers.image.licenses=GPL-2.0

      - name: Build and smoke test (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ftn:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Container starts and answers /api/health
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name ftn -p 8765:8765 -e FTN_PASSWORD=ci ftn:test
          docker exec ftn ffmpeg -hide_banner -version | head -1
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health && exit 0; sleep 1; done
          docker logs ftn; exit 1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Keyless Sigstore signature of the pushed image (README › Verificar las descargas):
      # cosign verify ghcr.io/freethenoize/freethenoize:latest \
      #   --certificate-identity-regexp '^https://github.com/FreeTheNoize/FreeTheNoize/\.github/workflows/docker\.yml@' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign the image (cosign, keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
