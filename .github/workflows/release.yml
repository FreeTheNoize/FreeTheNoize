# Release flow (see CONTRIBUTING.md › Releases):
#  1. Every push to main updates the "release PR" that release-please keeps open:
#     next version (from the Conventional Commit titles) + CHANGELOG. That PR is the release review.
#  2. Merging it (1 approval) creates the vX.Y.Z tag and the GitHub release,
#     builds the desktop zips and the Docker image, and attaches/publishes them.
#  3. Opens a back-merge PR main → develop so develop gets the version bump and the changelog.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild and re-attach the assets of an existing release tag (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # Bot token (GitHub App) so the release PR triggers the required checks.
      # Without the App it falls back to GITHUB_TOKEN: then close and reopen the release PR to run them.
      - id: app
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  inputs:
    name: Release to build
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: inputs
    if: always() && needs.inputs.result == 'success'
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.inputs.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  docker:
    needs: inputs
    if: always() && needs.inputs.result == 'success'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.inputs.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  back-merge:
    name: Back-merge main → develop
    needs: [release-please, desktop, docker]
    if: always() && needs.release-please.outputs.created == 'true' && needs.desktop.result == 'success' && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: app
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Open PR main → develop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if gh pr list -R "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A back-merge PR is already open"; exit 0
          fi
          gh pr create -R "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: back-merge $TAG into develop" \
            --body "Trae a \`develop\` el cambio de versión y el CHANGELOG de **$TAG**. Fusionar con **merge commit** (no squash) para no desalinear las ramas." \
            --label "release"
