# Desktop builds (PyInstaller): macOS Apple Silicon/Intel, Windows x64, Linux x64.
# On a release (called from release.yml) the zips, the Windows installer and the macOS disk images are attached to the GitHub release.
name: Desktop builds
on:
  pull_request:
    # The app code too: a frozen build can break where `pytest` can't see it
    # (e.g. no stdout/stderr in the windowed Windows exe).
    paths: ["freethenoize/**", "packaging/**", "pyproject.toml", ".github/workflows/desktop.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the zips to (vX.Y.Z)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FreeTheNoize-macOS-AppleSilicon.zip
          - os: macos-15-intel
            artifact: FreeTheNoize-macOS-Intel.zip
          - os: windows-latest
            artifact: FreeTheNoize-Windows-x64-Portable.zip
          - os: ubuntu-22.04
            artifact: FreeTheNoize-Linux-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv pip install -e ".[desktop,dev]"
      - run: pyinstaller packaging/freethenoize.spec --noconfirm
      # Not notarized (no paid Apple account): PyInstaller signs the bundle ad hoc,
      # which Apple Silicon requires to run it at all. Fail if that ever breaks.
      - name: Ad hoc signature (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/FreeTheNoize.app
          codesign -dv dist/FreeTheNoize.app 2>&1 | grep -q '^Signature=adhoc'
      - name: Smoke test (serve mode)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/FreeTheNoize.app/Contents/MacOS/FreeTheNoize
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/FreeTheNoize/FreeTheNoize.exe
          else BIN=dist/FreeTheNoize/FreeTheNoize; fi
          FTN_DATA_DIR="$RUNNER_TEMP/ftn" "$BIN" serve --port 8799 --password x &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8799/api/health && exit 0
            sleep 1
          done
          echo "server did not start"; exit 1
      # Start-Process gives no stdout/stderr, like a double-click in Explorer:
      # the case the bash smoke test above cannot see.
      - name: Smoke test (Windows, launched like a double-click)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FTN_DATA_DIR = "$env:RUNNER_TEMP\ftn-dblclick"
          $p = Start-Process dist\FreeTheNoize\FreeTheNoize.exe -ArgumentList 'serve','--port','8798','--password','x' -PassThru
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8798/api/health | Out-Null; Stop-Process $p -Force; exit 0 } catch { Start-Sleep 1 }
          }
          Get-Content "$env:LOCALAPPDATA\FreeTheNoize\Logs\freethenoize.log" -ErrorAction SilentlyContinue
          "server did not start without console streams"; exit 1
      - name: Qt window backend is bundled (Linux)
        if: runner.os == 'Linux'
        run: |
          ls dist/FreeTheNoize/_internal/PyQt6/QtWebEngineWidgets*.so dist/FreeTheNoize/_internal/PyQt6/Qt6/lib/libQt6WebEngineCore.so.6
          du -sh dist/FreeTheNoize
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent FreeTheNoize.app ../${{ matrix.artifact }}
      # The main macOS download: a disk image with "drag to Applications".
      - name: DMG (macOS)
        if: runner.os == 'macOS'
        env:
          ZIP: ${{ matrix.artifact }}
        run: |
          DMG="${ZIP%.zip}.dmg"
          mkdir -p dmg && cp -R dist/FreeTheNoize.app dmg/ && ln -s /Applications dmg/Aplicaciones
          cp packaging/macos/LEEME.txt "dmg/Si macOS no deja abrirla.txt"
          hdiutil create -volname FreeTheNoize -srcfolder dmg -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov "$DMG"
          # The image mounts and holds a launchable app.
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')
          test -x "$MNT/FreeTheNoize.app/Contents/MacOS/FreeTheNoize"
          hdiutil detach "$MNT"
          ls -l "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          compression-level: 0
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/FreeTheNoize -DestinationPath ${{ matrix.artifact }}
      # The installer is the main Windows download (see packaging/windows/freethenoize.iss).
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path freethenoize/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          # WebView2 bootstrapper, only accepted if signed by Microsoft.
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile dist\MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature dist\MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { "bad WebView2 bootstrapper signature: $($sig.Status) $($sig.SignerCertificate.Subject)"; exit 1 }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp /DAppVersion=$ver /DSourceDir="$PWD\dist\FreeTheNoize" /DWebView2Setup="$PWD\dist\MicrosoftEdgeWebview2Setup.exe" packaging\windows\freethenoize.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item dist\FreeTheNoize-Windows-x64-Setup.exe .
          Get-Item FreeTheNoize-Windows-x64-Setup.exe | Select Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: FreeTheNoize-Windows-x64-Setup.exe
          path: FreeTheNoize-Windows-x64-Setup.exe
          compression-level: 0
      # As a user would: downloaded (marked), per-user install without admin,
      # the installed app starts, upgrade over itself, uninstall cleans up.
      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$PWD\FreeTheNoize-Windows-x64-Setup.exe"
          Set-Content -LiteralPath $setup -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          # A marked file opened through the shell shows "Do you want to run this file?"
          # and waits for a click nobody gives on CI. Skip only that prompt; the mark
          # stays, so the check that installed files are unmarked still means something.
          $env:SEE_MASK_NOZONECHECKS = '1'
          $app = "$env:LOCALAPPDATA\Programs\FreeTheNoize"
          function Run([string]$exe, [string[]]$argv, [string]$what) {
            "== $what"
            $p = Start-Process $exe -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit(240000)) { "${what}: still running after 4 min"; Get-Process | Where-Object { $_.Path -like "*FreeTheNoize*" -or $_.Name -like "*unins*" -or $_.Name -like "*Setup*" } | Format-Table Id, Name, Path -AutoSize | Out-String; exit 1 }
            if ($p.ExitCode) { "${what} failed: $($p.ExitCode)"; exit 1 }
          }
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$env:RUNNER_TEMP\setup1.log") 'install'
          if (-not (Test-Path "$app\FreeTheNoize.exe")) { "not installed in $app"; exit 1 }
          $startLnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FreeTheNoize.lnk"
          $deskLnk = "$([Environment]::GetFolderPath('Desktop'))\FreeTheNoize.lnk"
          $regKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{53AEF833-7AED-4A46-A2C1-DEF78E1A0189}_is1'
          foreach ($f in $startLnk, $deskLnk, $regKey) { if (-not (Test-Path $f)) { "missing after install: $f"; exit 1 } }
          $marked = Get-ChildItem $app -Recurse -File | ForEach-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }
          if ($marked) { "installed files carry the download mark:"; $marked.FileName; exit 1 }
          "== installed app starts"
          $env:FTN_DATA_DIR = "$env:RUNNER_TEMP\ftn-setup"
          $p = Start-Process "$app\FreeTheNoize.exe" -ArgumentList 'serve', '--port', '8796', '--password', 'x' -PassThru
          $ok = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://127.0.0.1:8796/api/health -TimeoutSec 2 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process FreeTheNoize -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { "installed app did not start"; exit 1 }
          Start-Sleep 2
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$env:RUNNER_TEMP\setup2.log") 'upgrade in place'
          $un = Get-ChildItem $app -Filter 'unins*.exe' | Select-Object -First 1
          Run $un.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') 'uninstall'
          Start-Sleep 3
          $left = @($app, $startLnk, $deskLnk, $regKey) | Where-Object { Test-Path $_ }
          if ($left) { "uninstall left behind:"; $left; exit 1 }
          # User data stays unless asked (/PURGE=1); the music folder is never touched.
          $data = "$env:LOCALAPPDATA\FreeTheNoize"
          New-Item -ItemType Directory "$data\Logs" -Force | Out-Null; Set-Content "$data\settings.json" '{}'
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') 'reinstall'
          $un = Get-ChildItem $app -Filter 'unins*.exe' | Select-Object -First 1
          Run $un.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') 'uninstall keeping data'
          Start-Sleep 3
          if (-not (Test-Path "$data\settings.json")) { "uninstall removed user data without /PURGE"; exit 1 }
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') 'reinstall'
          $un = Get-ChildItem $app -Filter 'unins*.exe' | Select-Object -First 1
          Run $un.FullName @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PURGE=1') 'uninstall with /PURGE=1'
          Start-Sleep 3
          $left = @($app, $data, $startLnk, $deskLnk, $regKey) | Where-Object { Test-Path $_ }
          if ($left) { "purge left behind:"; $left; exit 1 }
          "installer OK"
      - name: Installer logs (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem $env:RUNNER_TEMP -Filter 'setup*.log' -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qry ../${{ matrix.artifact }} FreeTheNoize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          compression-level: 0

      # Explorer marks every file extracted from a downloaded zip (Zone.Identifier);
      # .NET then refuses pythonnet/WebView2 and the app fell back to the browser.
      - name: Native window with downloaded-zip marks (Windows)
        if: runner.os == 'Windows'
        # Runs after the upload so the zip is there to test by hand if it fails.
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem dist\FreeTheNoize -Recurse -Include *.dll | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $env:FTN_DATA_DIR = "$env:RUNNER_TEMP\ftn-motw"
          $log = "$env:LOCALAPPDATA\FreeTheNoize\Logs\freethenoize.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process dist\FreeTheNoize\FreeTheNoize.exe -PassThru
          Start-Sleep 40
          $exited = $p.HasExited
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if (-not $exited) { Stop-Process $p -Force -ErrorAction SilentlyContinue }
          $text
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='.NET Runtime','Application Error'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Message }
          if ($text -match "No se pudo abrir la ventana|Failed to resolve") { "native window failed"; exit 1 }
          if ($exited) { "app exited ($('0x{0:X8}' -f $p.ExitCode))"; exit 1 }

  attach:
    name: Attach to release
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: FreeTheNoize-*  # only the downloads, never a helper artifact of the build
          merge-multiple: true
      - run: (cd dist && sha256sum -- *.zip *.exe *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.zip dist/*.exe dist/*.dmg dist/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
