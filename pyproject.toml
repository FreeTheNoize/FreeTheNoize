[project]
name = "freethenoize"
version = "3.0.0.dev0"
description = "FreeTheNoize — descarga SoundCloud a la máxima calidad disponible, con espectrograma y comparador"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "pywebview>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
freethenoize = "freethenoize.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freethenoize"]
