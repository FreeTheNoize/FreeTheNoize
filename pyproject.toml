[project]
name = "gkicks-scdl"
version = "2.0.0"
description = "FreeTheNoize — SoundCloud, YouTube & YouTube Music audio downloader"
requires-python = ">=3.10"
dependencies = [
    "scdl>=3.0.4",
    "Pillow>=10.0.0",
    "imageio-ffmpeg>=0.5.0",
    "pygame-ce>=2.5.0",
    "psutil>=5.9.0",
    "yt-dlp>=2024.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
gkicks-scdl = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
